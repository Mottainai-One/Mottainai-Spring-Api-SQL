spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: mottainai

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: mottainai
        format_sql: true

  flyway:
    enabled: true
    schemas: mottainai
    default-schema: mottainai
    create-schemas: true
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: https://mottainai.local
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
